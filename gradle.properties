# Options passées à la JVM qui exécute Gradle (mémoire, encodage).
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Active AndroidX (obligatoire pour Compose et les libs Jetpack modernes).
android.useAndroidX=true

# Compilation Kotlin en mode "officiel" pour la gestion des types nullables.
kotlin.code.style=official

# N'inclut dans le R (ressources) que les ressources du module, pas celles des dépendances.
android.nonTransitiveRClass=true

# Compile en parallèle et met en cache les résultats -> builds plus rapides.
org.gradle.parallel=true
org.gradle.caching=true
